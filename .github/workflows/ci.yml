name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          
      - name: Install Root Dependencies
        run: npm ci
        
      - name: Install Webview Dependencies
        run: cd webview && npm ci
        
      - name: Lint Code
        run: npm run lint
        
      - name: Run Tests
        run: npm run test
        
      - name: Build Webview
        run: npm run build:webview
        
      - name: Compile Extension
        run: npm run compile
